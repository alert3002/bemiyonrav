workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: bemiyonrav
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: tj.bemiyonrav.app
      vars:
        XCODE_WORKSPACE: BeMienrav.xcworkspace
        XCODE_SCHEME: BeMienrav
      node: v22.13.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Generate the iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Apply the signing profile
        script: xcode-project use-profiles
      - name: Set the build number
        script: |
          cd "$CM_BUILD_DIR/ios"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build the App Store package
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
